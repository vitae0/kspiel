name: Verify KSpiel feature branches
on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Scenario runtime smoke test
        run: node scripts/smoke-theaters.cjs
      - name: FFA 3/4/5 balanced map and supply tests
        run: node scripts/smoke-ffa.cjs
      - name: Attrition and synchronized march tests
        run: node scripts/smoke-attrition.cjs
      - name: Typecheck and static build
        run: npm run build
