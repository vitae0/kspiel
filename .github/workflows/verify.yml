name: Verify KSpiel feature branches
on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Scenario runtime smoke test
        run: node scripts/smoke-theaters.cjs
      - name: Attrition and synchronized march tests
        run: node scripts/smoke-attrition.cjs
      - name: Spatial index parity checks
        run: node scripts/smoke-spatial.cjs
      - name: Supply route parity test
        run: node scripts/smoke-supply.cjs
      - name: Simulation performance sample (non-gating)
        run: KSPIEL_BENCH_UNITS=100 npm run bench:sim
      - name: Typecheck and static build
        run: npm run build
